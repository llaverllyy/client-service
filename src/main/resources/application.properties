spring.application.name=client-service
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clients_db}
spring.datasource.username=${DB_USER:clients_user}
spring.datasource.password=${DB_PASSWORD:clients_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.port=8080